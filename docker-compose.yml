version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kbase_db
    environment:
      # Lấy username và password từ biến môi trường (trong file .env của bạn)
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: kbase
    ports:
      - "5432:5432" # Để bạn vẫn có thể dùng DBeaver/DataGrip kết nối vào DB
    volumes:
      # Lưu data thực tế ra ngoài để khi tắt container không bị mất dữ liệu
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: kbase_app
    ports:
      - "8080:8080"
    environment:
      # Ghi đè DB_URL để trỏ tới container "db" thay vì "localhost"
      - DB_URL=jdbc:postgresql://db:5432/kbase
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      # Truyền tiếp các biến khác từ .env vào container
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET=${R2_BUCKET}
    depends_on:
      - db # Yêu cầu chạy DB trước rồi mới khởi động App
    restart: unless-stopped

volumes:
  postgres_data:
